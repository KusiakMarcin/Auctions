<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join AuctionHouse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">

            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 bg-success bg-opacity-10 text-success rounded-circle mb-3">
                            <i class="bi bi-person-plus fs-3"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Create Account</h3>
                        <p class="text-muted small">Join AuctionHouse to start bidding and listing items</p>
                    </div>

                    <form th:action="@{/register}" th:object="${userDto}" method="post">

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-secondary small fw-semibold">First Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                                    <input type="text" th:field="*{name}" class="form-control bg-light border-start-0 ps-0" placeholder="John" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secondary small fw-semibold">Last Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                                    <input type="text" th:field="*{lastName}" class="form-control bg-light border-start-0 ps-0" placeholder="Doe" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                                <input type="email" th:field="*{email}" class="form-control bg-light border-start-0 ps-0" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" th:field="*{password}" class="form-control bg-light border-start-0 ps-0" placeholder="Create a strong password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2.5 fw-bold rounded-3 shadow-sm mb-3">
                            Sign Up <i class="bi bi-check-circle-short ms-1"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top">
                        <p class="text-muted small mb-0">Already have an account?
                            <a th:href="@{/login}" class="text-success fw-semibold text-decoration-none">Log in here</a>
                        </p>
                    </div>

                </div>
            </div> </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
