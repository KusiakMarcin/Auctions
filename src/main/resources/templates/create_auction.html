<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Create New Auction</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Start a New Auction</h4>
        </div>
        <div class="card-body">
          <form th:action="@{/auctions/new}" th:object="${auctionDto}" method="post">

            <div class="mb-3">
              <label for="title" class="form-label">Item Title</label>
              <input type="text" th:field="*{title}" class="form-control"
                     placeholder="e.g. Vintage Camera" required>
            </div>

            <div class="mb-3">
              <label for="startingBid" class="form-label">Starting Bid ($)</label>
              <input type="number" step="0.01" th:field="*{startingBid}"
                     class="form-control" placeholder="0.00" required>
            </div>

            <div class="mb-3">
              <label for="expirationDate" class="form-label">Expiration Date & Time</label>
              <input type="datetime-local" th:field="*{expirationDate}"
                     class="form-control" required>
              <div class="form-text">When should the bidding end?</div>
            </div>
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select th:field="*{category}" class="form-select" id="category" required>
                <option value="" disabled selected>Select a category...</option>
                <option value="Electronics">Electronics</option>
                <option value="Cars">Cars</option>
                <option value="Audio & Video">Audio & Video</option>
                <option value="Collectibles">Collectibles</option>
                <option value="Furniture">Furniture</option>
                <option value="Tools">Tools</option>
              </select>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success">Post Auction</button>
              <a th:href="@{/auctions}" class="btn btn-outline-secondary">Cancel</a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
