<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile - AuctionHouse</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <!-- Header: User Info & Balance -->
    <div class="row mb-4">
        <div class="col-md-8">
            <h2 th:text="'Welcome back, ' + ${user.name} + '!'">Welcome</h2>
            <p class="text-muted" th:text="${user.email}">user@example.com</p>
        </div>
        <div class="col-md-4 text-end">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5>Current Balance</h5>
                    <h3 th:text="${#numbers.formatCurrency(user.balance)}">$0.00</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Left Column: My Auctions -->
        <div class="col-md-6">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0">My Auctions</h4>
                <a th:href="@{/auctions/new}" class="btn btn-primary btn-sm">
                    + Create New Auction
                </a>
            </div>
        <div class="col-md-6">

            <div class="list-group">
                <div th:each="auction : ${myAuctions}" class="list-group-item">
                    <h6 class="mb-1" th:text="${auction.title}">Auction Title</h6>
                    <small th:text="'Starting Price: ' + ${auction.startingPrice}">$0</small>
                </div>
                <div th:if="${#lists.isEmpty(myAuctions)}" class="text-muted">You haven't posted any auctions yet.</div>
            </div>
        </div>

        <!-- Right Column: My Bids -->
        <div class="col-md-6">
            <h4>My Bids</h4>
            <table class="table table-striped bg-white shadow-sm">
                <thead>
                <tr>
                    <th>Item</th>
                    <th>Amount</th>
                    <th>Date</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="bid : ${myBids}">
                    <td th:text="${bid.auctionTitle}">Item Name</td>
                    <td th:text="${bid.amount}">$50.00</td>
                    <td th:text="${#dates.format(bid.bidTime, 'dd-MM-yyyy HH:mm')}">Date</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
